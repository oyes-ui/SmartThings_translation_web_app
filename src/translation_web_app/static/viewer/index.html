<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Review Visualizer</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="markdown.css">

    <!-- Markdown rendering + sanitizing. DOMPurify is mandatory: report bodies
         are user/agent-authored Markdown and may contain raw HTML. -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <!-- Renders `> [!type] title` callouts (Obsidian + GitHub alert syntax).
         Module scripts are deferred, so this resolves before app.js's
         DOMContentLoaded handler runs. No bundled global build exists, so it
         is loaded via jsdelivr's ESM re-export instead of a plain <script>. -->
    <script type="module">
        import obsidianCallouts from "https://cdn.jsdelivr.net/npm/markdown-it-obsidian-callouts@0.3.4/+esm";
        window.mditObsidianCallouts = obsidianCallouts;
    </script>

    <!-- html2pdf.js for exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header nav-blur">
            <div class="header-content">
                <div class="logo">
                    <i class="ri-translate-2"></i>
                    <h1>Review Visualizer</h1>
                </div>
                <div class="header-actions">
                    <button id="export-btn" class="btn btn-primary" style="display: none;">
                        <i class="ri-file-pdf-line"></i>
                        <span>PDF 다운로드</span>
                    </button>
                    <button id="theme-toggle" class="btn btn-icon">
                        <i class="ri-moon-line"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Layout with Sidebar -->
        <div class="main-layout">
            <!-- Sidebar Navigation -->
            <aside class="sidebar" id="sidebar" style="display: none;">
                <div class="sidebar-inner">
                    <h3 class="sidebar-title">목차 (Findings)</h3>
                    <nav class="nav-menu" id="nav-menu">
                        <!-- Navigation links injected here -->
                    </nav>
                    <div class="version-info"
                        style="margin-top: auto; padding: 20px 0 10px 0; border-top: 1px solid rgba(0,0,0,0.05); font-size: 11px; color: #94a3b8; display: flex; flex-direction: column; gap: 4px;">
                        <span>Version v1.6.0</span>
                        <span>Markdown report viewer</span>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="content-area">
                <!-- Upload Section -->
                <section id="upload-section" class="upload-container">
                    <div class="upload-box" id="drop-zone">
                        <input type="file" id="file-input" accept=".md,.markdown,text/markdown" hidden>
                        <div class="upload-icon">
                            <i class="ri-markdown-line"></i>
                        </div>
                        <h2>Markdown 리포트(.md)를 업로드하세요</h2>
                        <p class="upload-hint">파일을 여길 드래그하거나 클릭하여 선택하세요.</p>
                        <p class="upload-hint" style="margin-top:6px;">
                            <code>?file=/api/report/{task_id}</code> 로 자동 로드도 가능합니다.
                        </p>
                        <button class="btn btn-primary mt-4"
                            onclick="document.getElementById('file-input').click()">
                            파일 선택
                        </button>
                    </div>
                </section>

                <!-- Loading / error banner -->
                <div id="status-banner" class="status-banner" style="display:none;"></div>

                <!-- Dashboard / Executive Summary -->
                <section id="dashboard" class="dashboard-section" style="display: none;">
                    <div class="dashboard-header">
                        <h2>리포트 요약 (Executive Summary)</h2>
                        <div id="filter-bar" class="filter-bar"></div>
                    </div>
                    <div class="dashboard-grid" id="dashboard-content">
                        <!-- Dashboard widgets injected here -->
                    </div>
                </section>

                <!-- Rendered Markdown -->
                <section id="report-content" class="report-container" style="display: none;">
                    <article id="markdown-body" class="markdown-body"></article>
                </section>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>

</html>
